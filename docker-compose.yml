name: rutaia

services:
  db:
    image: postgres:16-alpine
    container_name: rutaia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rutaia}
      POSTGRES_USER: ${POSTGRES_USER:-rutaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rutaia_local_dev}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Los scripts se ejecutan solo la primera vez que se crea el volumen.
      - ./db/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.postgres.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # API en contenedor (opcional). Útil para probar el despliegue en local:
  #   docker compose --profile full up -d --build
  api:
    profiles: ['full']
    build:
      context: ./server
    container_name: rutaia-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-rutaia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rutaia_local_dev}
      DB_NAME: ${POSTGRES_DB:-rutaia}
      DB_CONNECTION_LIMIT: 10
      DATABASE_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_por_uno_largo_y_aleatorio}
      JWT_EXPIRES_IN: 1h
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL_LITE: ${GROQ_MODEL_LITE:-openai/gpt-oss-20b}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TOKEN_QUOTA_DEFAULT: ${TOKEN_QUOTA_DEFAULT:-50000}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
    name: rutaia_postgres_data
