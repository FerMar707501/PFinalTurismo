services:
  # ---------------------------------------------------------------
  # API + frontend compilado en un único servicio de Node.
  # Express sirve client/dist y /api desde el mismo dominio, así que
  # la app y la documentación comparten URL.
  # ---------------------------------------------------------------
  - type: web
    name: rutaia-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Render inyecta DATABASE_URL desde la base de datos vinculada.
      - key: DATABASE_URL
        fromDatabase:
          name: rutaia-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DB_CONNECTION_LIMIT
        value: 10
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_LITE
        value: openai/gpt-oss-20b
      - key: CORS_ORIGIN
        value: '*'
      - key: TOKEN_QUOTA_DEFAULT
        value: 50000

databases:
  - name: rutaia-db
    plan: free
    region: oregon
    databaseName: rutaia_db
    user: rutaia_db_user
    postgresMajorVersion: '16'
